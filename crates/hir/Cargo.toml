[package]
name = "sumi-hir"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
sumi-frontend = { path = "../frontend" }
sumi-lexer = { path = "../lexer" }
sumi-syntax = { path = "../syntax" }
sumi-text = { path = "../text" }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "=5.0.1", default-features = false, features = ["cargo_bench_support"] }
proptest = "=1.11.0"
tempfile = "=3.27.0"

[[bench]]
name = "solver"
harness = false

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "allocations"
harness = false
