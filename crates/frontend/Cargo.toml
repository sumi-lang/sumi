[package]
name = "sumi-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
sumi-diagnostics = { path = "../diagnostics" }
sumi-lexer = { path = "../lexer" }
sumi-syntax = { path = "../syntax" }
sumi-text = { path = "../text" }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "=5.0.1", default-features = false, features = ["cargo_bench_support"] }
proptest = "=1.11.0"

[[bench]]
name = "pipeline"
harness = false
