name: Fuzz

on:
  schedule:
    # Daily, off the hour; every target runs for the default budget.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lex, parse, edit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # The cache holds the cargo-fuzz binary with the install records that
      # let `cargo install` skip it, and the instrumented dependencies. A
      # finding fails the job, and is the run whose cache is most worth
      # keeping, so save on failure too.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - run: cargo install cargo-fuzz --locked
      # The corpus carries over between runs so coverage compounds: every
      # run restores the newest one before it and saves its own, on
      # failure as well, since the corpus that led to a finding is the one
      # a fix needs to replay.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The file-based cases are the seeds; a restored corpus already holds
      # everything they add, and libFuzzer keeps only what is new.
      - run: cargo run --locked --package xtask -- fuzz-seed
      # The crates are safe Rust, so no sanitizer: that is what keeps the
      # stable toolchain enough.
      - name: Fuzz
        run: >
          cargo fuzz run -s none ${{ matrix.target }} --
          -dict=fuzz/sumi.dict
          -max_len=4096
          -max_total_time=$(( 60 * ${{ inputs.minutes || 10 }} ))
          -timeout=10
          -rss_limit_mb=2048
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # A finding is the input that broke an invariant; keep it to minimize
      # and turn into a corpus case with the fix.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
