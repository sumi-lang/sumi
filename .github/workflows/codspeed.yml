name: CodSpeed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codspeed.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
  pull_request:
    paths:
      - .github/workflows/codspeed.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: simulation, set: timing }
          - { mode: memory, set: memory }
    env:
      SUMI_BENCH_SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          cache-base: main
          bins: cargo-codspeed@5.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build benchmarks
        run: >
          cargo codspeed build --package sumi-frontend --package sumi-hir
          --bench pipeline --bench performance
          --measurement-mode ${{ matrix.mode }} --locked
      - name: Run benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          mode: ${{ matrix.mode }}
          run: >
            cargo codspeed run --package sumi-frontend --package sumi-hir
            --bench pipeline --bench performance
            --measurement-mode ${{ matrix.mode }}
