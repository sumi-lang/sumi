name: CodSpeed

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/codspeed.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
  pull_request:
    paths:
      - .github/workflows/codspeed.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Frontend benchmarks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [simulation, memory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          cache-base: main
          bins: cargo-codspeed@5.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build benchmarks
        run: >
          cargo codspeed build --package sumi-frontend --bench pipeline
          --measurement-mode ${{ matrix.mode }} --locked
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: ${{ matrix.mode }}
          run: >
            cargo codspeed run --package sumi-frontend --bench pipeline
            --measurement-mode ${{ matrix.mode }}
