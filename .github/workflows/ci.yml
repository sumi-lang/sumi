name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  codegen:
    name: Generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The kind enums, token classes, operator tables, and the grammar
      # chapter of the reference are generated from `sumi.grammar`; the
      # checked-in copies must be what it generates.
      - run: cargo run --locked --package xtask -- codegen --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      # A failing property writes its seed to the crate's tracked
      # `proptest-regressions/` file, which every later run replays before
      # generating anything new. The runner's copy would die with the job,
      # so keep it as an artifact to commit.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: proptest-regressions
          path: crates/*/proptest-regressions/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Branch coverage is nightly-only in cargo-llvm-cov.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
          components: llvm-tools-preview
      # Instrumented artifacts share nothing with the plain test build, so
      # keep them out of its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: coverage
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-llvm-cov
      # Tests and benches are already left out of the report; the leaves
      # that nothing ships run under instrumentation but stay out too.
      - run: >
          cargo llvm-cov --workspace --locked --branch
          --ignore-filename-regex '(^|/)(xtask|fuzz|crates/(scorecard|test))/'
          --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: true

  scorecard:
    name: Recovery scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The harness is seeded and count-based, so its output must match the
      # committed reference byte for byte; the reference's verbatim section
      # starts at the `recovery-scorecard` marker line.
      - run: |
          cargo run --release --locked -p sumi-scorecard > scorecard.txt
          if ! sed -n '/^recovery-scorecard$/,$p' crates/scorecard/recovery-scorecard.txt | diff - scorecard.txt; then
            echo "::error::recovery scorecard drifted from crates/scorecard/recovery-scorecard.txt;" \
              "if the change is intended, regenerate the reference with" \
              "'cargo run --release -p sumi-scorecard'"
            exit 1
          fi
